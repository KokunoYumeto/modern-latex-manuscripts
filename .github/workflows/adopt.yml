name: Adoption contract

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.json"
      - ".github/workflows/adopt.yml"
      - "README.md"
      - "docs/**"
      - "reader-pdfs/README.md"
      - "sources/README.md"
      - "manifests/adopt.check.json"
      - "manifests/adopt.json"
      - "manifests/adopt.schema.json"
      - "manifests/stacks-pin.json"
      - "manifests/stacks-overlay.json"
      - "manifests/stacks-compose.json"
      - "manifests/stacks-entry.schema.json"
      - "manifests/stacks-preflight.json"
      - "manifests/github-custody/**"
      - "scripts/check-adopt.ps1"
      - "scripts/check-claims.py"
      - "scripts/check-stacks-entry.py"
      - "scripts/get-adopt.py"
      - "scripts/test-adopt-offline.py"
      - "scripts/test-claims.py"
      - "scripts/test-stacks-entry.py"
      - "scripts/stacks-preflight.py"
      - "scripts/test-stacks-preflight.py"
  push:
    branches:
      - main
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.json"
      - ".github/workflows/adopt.yml"
      - "README.md"
      - "docs/**"
      - "reader-pdfs/README.md"
      - "sources/README.md"
      - "manifests/adopt.check.json"
      - "manifests/adopt.json"
      - "manifests/adopt.schema.json"
      - "manifests/stacks-pin.json"
      - "manifests/stacks-overlay.json"
      - "manifests/stacks-compose.json"
      - "manifests/stacks-entry.schema.json"
      - "manifests/stacks-preflight.json"
      - "manifests/github-custody/**"
      - "scripts/check-adopt.ps1"
      - "scripts/check-claims.py"
      - "scripts/check-stacks-entry.py"
      - "scripts/get-adopt.py"
      - "scripts/test-adopt-offline.py"
      - "scripts/test-claims.py"
      - "scripts/test-stacks-entry.py"
      - "scripts/stacks-preflight.py"
      - "scripts/test-stacks-preflight.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adoption-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate exact-commit interface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/ISSUE_TEMPLATE/
            /.github/labels.json
            /.github/workflows/adopt.yml
            /README.md
            /docs/
            /manifests/adopt.check.json
            /manifests/adopt.json
            /manifests/adopt.schema.json
            /manifests/stacks-pin.json
            /manifests/stacks-overlay.json
            /manifests/stacks-compose.json
            /manifests/stacks-entry.schema.json
            /manifests/stacks-preflight.json
            /manifests/github-custody/maps-r8.json
            /reader-pdfs/README.md
            /sources/README.md
            /scripts/check-adopt.ps1
            /scripts/check-claims.py
            /scripts/check-stacks-entry.py
            /scripts/get-adopt.py
            /scripts/test-adopt-offline.py
            /scripts/test-claims.py
            /scripts/test-stacks-entry.py
            /scripts/stacks-preflight.py
            /scripts/test-stacks-preflight.py

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0

      - name: Replay the exact executable Stacks blocked-state preflight
        shell: bash
        run: |
          set -euo pipefail
          python scripts/stacks-preflight.py \
            --root . \
            --expect BLOCKED_EMPTY_OVERLAY_REGISTRY \
            > "$RUNNER_TEMP/stacks-preflight.json"
          cmp manifests/stacks-preflight.json "$RUNNER_TEMP/stacks-preflight.json"
          python scripts/test-stacks-preflight.py --root .

      - name: Replay valid and invalid Stacks candidate-entry fixtures
        run: python scripts/test-stacks-entry.py --root .

      - name: Validate the board, schema, maps, queues, and interfaces
        shell: pwsh
        run: |
          ./scripts/check-adopt.ps1 -SparseCheckout -OutputPath "$env:RUNNER_TEMP/adopt.check.json"
          $report = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP/adopt.check.json" | ConvertFrom-Json -Depth 100
          if ($report.status -cne 'PASS' -or @($report.errors).Count -ne 0) {
            throw 'The regenerated adoption validation report is not PASS/errors[].'
          }
          $checked = Get-Content -Raw -LiteralPath "manifests/adopt.check.json" | ConvertFrom-Json -Depth 100
          if ($checked.status -cne 'PASS' -or @($checked.errors).Count -ne 0) {
            throw 'The checked-in adoption validation report is not PASS/errors[].'
          }
          foreach ($field in @('board', 'schema_file', 'map_manifest', 'stacks_reference_layer')) {
            $expected = $checked.$field | ConvertTo-Json -Depth 100 -Compress
            $actual = $report.$field | ConvertTo-Json -Depth 100 -Compress
            if ($actual -cne $expected) { throw "Checked-in validation field is stale: $field" }
          }
          foreach ($field in @(
            'stacks_architecture_layers', 'stacks_overlay_registry_entries',
            'stacks_overlay_mathematical_entries', 'stacks_static_contract_checks',
            'stacks_executable_preflight_runs',
            'stacks_candidate_entry_contract_files',
            'stacks_candidate_entry_regression_defined_cases',
            'stacks_candidate_entry_regression_required_cases',
            'stacks_candidate_manifests_accepted',
            'stacks_composition_runs', 'stacks_generated_members', 'stacks_builds',
            'stacks_intake_fields', 'stacks_claim_routes',
            'stacks_overlay_mutation_probes', 'stacks_overlay_mutation_rejections',
            'stacks_composition_mutation_probes', 'stacks_composition_mutation_rejections',
            'stacks_preflight_mutation_probes', 'stacks_preflight_mutation_rejections'
          )) {
            if ($report.aggregate.$field -cne $checked.aggregate.$field) {
              throw "Checked-in validation aggregate is stale: $field"
            }
          }
          foreach ($field in @(
            'stacks_reference_layer_contract', 'stacks_overlay_registry_contract',
            'stacks_candidate_entry_contract',
            'stacks_composition_contract', 'stacks_preflight_result_contract',
            'stacks_empty_preflight_mutation_contract',
            'map_manifest_member_replay'
          )) {
            if ($report.checks.$field -cne $checked.checks.$field) {
              throw "Checked-in validation check is stale: $field"
            }
          }

      - name: Replay the exact local four-file consumer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/get-adopt.py \
            --commit "$GITHUB_SHA" \
            --approve "$GITHUB_SHA" \
            --git . \
            > "$RUNNER_TEMP/adopt.json"
          cmp manifests/adopt.json "$RUNNER_TEMP/adopt.json"

      - name: Prove missing promisor blobs fail without a lazy fetch
        run: python scripts/test-adopt-offline.py --commit "$GITHUB_SHA" --git .

      - name: Replay valid and invalid claim lifecycle fixtures
        run: python scripts/test-claims.py --commit "$GITHUB_SHA" --git .
