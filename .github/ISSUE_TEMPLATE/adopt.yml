name: Adopt or mirror a work
description: Declare a bounded adoption, independent mirror, source intake, or result.
title: "[Adopt] "
labels:
  - adoption
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/adopt.md` and the linked archive map first. This announces overlap; it does not reserve a work exclusively.
  - type: input
    id: board_id
    attributes:
      label: Board ID
      description: Copy the exact Board ID from the first column of `docs/adopt.md` (or from `manifests/adopt.json`), or use `new:<short-id>` for a proposed future row.
      placeholder: gauss-werke-ii
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Intent
      options:
        - Continue an exact cursor
        - Independently mirror/check existing work
        - Repair a bounded range
        - Bind source intake
        - Propose future scope
        - Return a completed result
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact scope
      description: Author, work, language, page/section range, starting cursor, and intended stopping point.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Starting evidence
      description: GitHub paths/commit, source identities, bytes or hashes, and predecessor generation.
    validations:
      required: true
  - type: input
    id: mirror
    attributes:
      label: Mirror or result URL
      description: Repository, branch, pull request, dataset, or other inspectable result; may be added later.
  - type: textarea
    id: checks
    attributes:
      label: Planned or completed checks
      description: Source comparison, compile, formula/diagram/table/reference checks, language review, and visual QA as applicable.
  - type: checkboxes
    id: agreement
    attributes:
      label: Traceability
      options:
        - label: I will preserve predecessors and declare overlap rather than silently overwriting existing work.
          required: true
        - label: I understand that opening this issue does not reserve the scope exclusively.
          required: true
