name: Correction or Source-Comparison Finding
description: Report a concrete error in a reader PDF, TeX source, translation, or source alignment.
title: "[Correction]: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Please make the report specific enough that another contributor can reproduce it from the public record.
  - type: input
    id: record
    attributes:
      label: Zenodo record
      description: Link to the public Zenodo record.
      placeholder: "https://zenodo.org/records/..."
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File
      description: Exact public filename, or artifact ZIP path if the issue is inside a source bundle.
      placeholder: "00 EGA - English Translation Working Draft.pdf"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, section, theorem, equation, or line
      placeholder: "p. 123, Proposition 4.2.1, equation (4.2.1.1)"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Mathematical content
        - Translation
        - TeX compile or layout
        - Diagram or table
        - Cross-reference or numbering
        - Source/provenance alignment
        - Metadata or naming
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Describe the problem and the current text/layout if useful.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source witness
      description: Link or describe the source scan/reference used to verify the correction.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Give replacement text, TeX, or a precise repair note when possible.
    validations:
      required: false

