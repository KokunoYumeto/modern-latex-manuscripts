name: Correction or Source-Comparison Finding
description: Report a concrete error in a reader PDF, TeX source, translation, or source alignment.
title: "[Correction]: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Check the GitHub coverage map first. Please make the report specific enough that another contributor can reproduce it from the exact GitHub generation.
  - type: input
    id: github_path
    attributes:
      label: GitHub path or commit link
      description: Exact repository path, preferably with the commit or byte hash for the generation checked.
      placeholder: "sources/author/work/file.tex @ commit SHA"
    validations:
      required: true
  - type: input
    id: external_receipt
    attributes:
      label: External producer receipt (optional)
      description: Add a producer-owned publication receipt only as supporting evidence.
    validations:
      required: false
  - type: input
    id: file
    attributes:
      label: File
      description: Exact GitHub filename or path inside the identified archive generation.
      placeholder: "00 EGA - English Translation Working Draft.pdf"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, section, theorem, equation, or line
      placeholder: "p. 123, Proposition 4.2.1, equation (4.2.1.1)"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Mathematical content
        - Translation
        - TeX compile or layout
        - Diagram or table
        - Cross-reference or numbering
        - Source/provenance alignment
        - Metadata or naming
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Describe the problem and the current text/layout if useful.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source witness
      description: Link or describe the source scan/reference used to verify the correction.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Give replacement text, TeX, or a precise repair note when possible.
    validations:
      required: false

