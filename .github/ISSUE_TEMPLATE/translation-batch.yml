name: Translation batch
description: Track a translation batch or handoff packet.
title: "[translation]: "
labels: ["translation", "batch"]
body:
  - type: input
    id: work
    attributes:
      label: Work or volume
      description: Example: SGA4 Expose I sections 8-10.
    validations:
      required: true
  - type: textarea
    id: contents
    attributes:
      label: Contents
      description: What files are included? TeX, PDF, source extracts, render checks, glossary, etc.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status
      description: Draft, checked, compiled, needs source alignment, needs math review.
    validations:
      required: true
