name: Bad or unreadable PDF
description: Report a corrupt, unreadable, malformed, oversized, or misleading reader PDF.
title: "[bad-pdf]: "
labels: ["pdf-quality", "needs-triage"]
body:
  - type: input
    id: file
    attributes:
      label: File
      description: Zenodo filename or repository path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong? Include page numbers if possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, text extraction, pdfinfo errors, or sample pages.
    validations:
      required: false
  - type: textarea
    id: proposed
    attributes:
      label: Proposed fix
      description: Demote, rebuild, replace, split, or remove duplicate?
    validations:
      required: false
