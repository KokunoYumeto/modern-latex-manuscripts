name: Return or hand back adopted work
description: Return an inspectable result, partial checkpoint, paused scope, or withdrawal.
title: "[Handback] "
labels:
  - adoption
body:
  - type: markdown
    attributes:
      value: |
        Link the original adoption issue and preserve its exact starting generation. A handback updates the board only when its result or terminal state is inspectable.
  - type: input
    id: board_id
    attributes:
      label: Board ID
      description: Copy the exact Board ID used by the original adoption issue.
      placeholder: gauss-werke-ii
    validations:
      required: true
  - type: input
    id: claim
    attributes:
      label: Adoption issue or mirror URL
      description: Link the original declaration so scope and overlap remain traceable.
      placeholder: https://github.com/.../issues/...
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Handback state
      description: Maps to the board mirror status returned, paused, or withdrawn.
      options:
        - returned — bounded result
        - returned — partial checkpoint
        - paused — open for continuation
        - withdrawn — no result
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact achieved scope
      description: Author, work, language, page/section range, and the actual terminal boundary.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Inspectable result
      description: Repository, exact commit, branch or PR, and the direct result paths. State explicitly if no result exists.
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Manifest and identities
      description: Paths, byte lengths, SHA-256 values, source authority, and predecessor/supersession identity.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks, failures, and reversals
      description: Exact checks run, pass/fail evidence, unresolved defects, and corrections or reversals retained.
    validations:
      required: true
  - type: textarea
    id: cursor
    attributes:
      label: Continuation cursor
      description: Exact next page/section/unit, or an explicit terminal/no-continuation statement.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Reusable workflow findings
      description: Methods another mirror should reuse or avoid; write "none" if there is no finding.
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Preservation and status
      options:
        - label: I preserved the starting generation and did not silently overwrite contradictory or superseded evidence.
          required: true
        - label: I kept quality/review state explicit and made no unsupported completion or certification claim.
          required: true
        - label: I understand that archive maps change only after the returned bytes or exact external identity are inspectable.
          required: true
