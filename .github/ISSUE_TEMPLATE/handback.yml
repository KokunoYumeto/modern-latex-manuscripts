name: Return or hand back adopted work
description: Return an inspectable result, partial checkpoint, paused scope, or withdrawal.
title: "[Handback] "
labels:
  - adoption
body:
  - type: markdown
    attributes:
      value: |
        Link the original adoption issue and preserve its exact starting generation. A handback updates the board only when its result or terminal state is inspectable.
        Returned results use exact `Result URI:` and `Immutable identity:` lines, manifest rows, check rows, and one `Next cursor:` or `Terminal:` line. Paused and withdrawn handbacks use the state-specific sentinels described below; plain `none` is never a result identity.
  - type: input
    id: board_id
    attributes:
      label: Board ID
      description: Copy the exact Board ID used by the original adoption issue.
      placeholder: gauss-werke-ii
    validations:
      required: true
  - type: input
    id: claim
    attributes:
      label: Adoption issue URL
      description: Link the original adoption issue so scope and overlap remain traceable.
      placeholder: https://github.com/.../issues/...
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Handback state
      description: Maps to the board mirror status returned, paused, or withdrawn.
      options:
        - returned — bounded result
        - returned — partial checkpoint
        - paused — open for continuation
        - withdrawn — no result
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact achieved scope
      description: Author, work, language, page/section range, and the actual terminal boundary.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Inspectable result
      description: "Returned: one `Result URI:` line with a public HTTPS URL, then `Immutable identity: git commit <40-hex>`, `Zenodo record <digits>`, or `SHA-256 <64-hex>`. Placeholders, missing hosts, and credential-bearing URLs are rejected. Paused: `NO_RESULT: paused`. Withdrawn: `NO_RESULT: withdrawn`."
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Manifest and identities
      description: "Returned: one or more `Manifest: <path-or-URL> | <bytes> bytes | SHA-256 <64-hex>` lines. Paused: `NO_MANIFEST: paused`. Withdrawn: `NO_MANIFEST: withdrawn`."
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks, failures, and reversals
      description: "Returned or paused: one or more `Check: <name> | PASS|FAIL|NOT_RUN | <details>` lines. Withdrawn: `NO_CHECKS: withdrawn`. Preserve failures and reversals in the details."
    validations:
      required: true
  - type: textarea
    id: cursor
    attributes:
      label: Continuation cursor
      description: "Returned: exactly one `Next cursor: <scope>` or `Terminal: <reason>` line. Paused requires `Next cursor: <scope>`. Withdrawn requires `Terminal: withdrawn without result`."
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Reusable workflow findings
      description: Methods another mirror should reuse or avoid; write "none" if there is no finding.
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Preservation and status
      options:
        - label: I preserved the starting generation and did not silently overwrite contradictory or superseded evidence.
          required: true
        - label: I kept quality/review state explicit and made no unsupported completion or certification claim.
          required: true
        - label: I understand that archive maps change only after the returned bytes or exact external identity are inspectable.
          required: true
