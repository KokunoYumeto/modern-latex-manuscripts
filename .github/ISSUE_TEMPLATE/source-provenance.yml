name: Source or provenance addition
description: Add a better scan, source witness, repository, or provenance note.
title: "[source]: "
labels: ["source", "provenance"]
body:
  - type: input
    id: work
    attributes:
      label: Work
      description: Author/title/work package.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: URL, archive identifier, bibliographic note, or repository.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this source matters
      description: Completeness, cleaner scans, missing pages, better provenance, etc.
    validations:
      required: true
