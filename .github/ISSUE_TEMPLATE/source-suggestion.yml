name: Source Scan or Work Suggestion
description: Suggest a better public source, missing work, or useful open TeX source.
title: "[Source]: "
labels: ["source"]
body:
  - type: input
    id: author_work
    attributes:
      label: Author and work
      placeholder: "Author, title, edition/year"
    validations:
      required: true
  - type: input
    id: source_link
    attributes:
      label: Source link
      description: Public scan, library record, repository, or bibliographic page.
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - Public scan or PDF
        - Existing open TeX
        - Bibliographic record
        - Translation
        - Correction/reference witness
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this helps
      description: Explain whether it fills a gap, improves scan quality, clarifies provenance, or replaces a weaker source.
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Rights or license notes
      description: Include public-domain, license, publication date, or access notes if known.
    validations:
      required: false

