name: Start a Commons Stacks layer
description: Bind one exact upstream pin and declare a Commons-owned overlay scope.
title: "[Adopt] Stacks Commons layer — "
labels:
  - adoption
body:
  - type: markdown
    attributes:
      value: |
        This starts or mirrors Board ID `stacks-commons-layer`. Upstream acceptance is not a Commons approval gate. Do not infer a repository, license, commit, motive, or endorsement: bind each exact identity below before producing a composed build.
  - type: dropdown
    id: board_id
    attributes:
      label: Board ID
      options:
        - stacks-commons-layer
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Intent
      options:
        - Replay the exact upstream pin and bind the first Commons overlay
        - Independently mirror or check an existing Commons overlay
        - Propose a deterministic composition and test fixture
        - Return source or license evidence only
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow token
      description: Select one exact workflow admitted by the Stacks board row.
      options:
        - upstream_overlay_sync
        - source_intake
        - assembly_review
        - independent_review
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact scope
      description: State the bounded upstream area, Commons additions or mappings, languages, outputs, and stopping point.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Starting evidence
      description: Cite exact source identities, predecessor overlay or review receipts, and any historical-source mapping evidence.
    validations:
      required: true
  - type: input
    id: writer
    attributes:
      label: Commons writer identity
      description: Name the one writer or repository owner for this bounded overlay namespace.
    validations:
      required: true
  - type: input
    id: upstream_repo
    attributes:
      label: Exact upstream repository URL
      description: Use the exact repository from the current board pin; later upstream movement requires a reviewed board successor first.
      placeholder: https://github.com/stacks/stacks-project
      value: https://github.com/stacks/stacks-project
    validations:
      required: true
  - type: input
    id: upstream_license
    attributes:
      label: Applicable upstream license identity
      description: Give the exact license identity from the current board pin.
      placeholder: GNU Free Documentation License Version 1.2, November 2002
      value: GNU Free Documentation License Version 1.2, November 2002
    validations:
      required: true
  - type: input
    id: upstream_commit
    attributes:
      label: Exact upstream commit
      description: Use the exact immutable commit from the current board pin; a branch or floating tag is not sufficient.
      placeholder: a04446e57ec1fbc252a871afcec7752fb2807b14
      value: a04446e57ec1fbc252a871afcec7752fb2807b14
    validations:
      required: true
  - type: input
    id: overlay_namespace
    attributes:
      label: Commons overlay namespace
      description: One lowercase slash-delimited token; each segment starts alphanumeric and does not end in a dot. Use owner/repository for a repository identity, never a URL or an upstream-owned or producer-owned tree.
      placeholder: commons/stacks/pilot
    validations:
      required: true
  - type: textarea
    id: composition
    attributes:
      label: Deterministic composition
      description: Exact command/tool version, ordered inputs, generated members, and expected manifest.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests and review plan
      description: Stable Commons IDs, provenance, corrections, multilingual links, regression tests, hardened review, and review receipts.
    validations:
      required: true
  - type: textarea
    id: sync_cursor
    attributes:
      label: Starting synchronization cursor
      description: Prior upstream pin or “first pin”; state how accepted, rejected, conflicting, and reversed sync decisions will be retained.
    validations:
      required: true
  - type: input
    id: mirror
    attributes:
      label: Mirror or result URL
      description: Commons repository, branch, PR, or inspectable result; may be added later.
  - type: checkboxes
    id: agreement
    attributes:
      label: Traceability
      options:
        - label: I will write only to the declared Commons-owned namespace and will not edit upstream or another task's files.
          required: true
        - label: I will preserve exact upstream and predecessor identities, conflicts, failures, corrections, and reversals.
          required: true
        - label: I will not imply upstream acceptance, approval, endorsement, or a motive for prior contribution outcomes.
          required: true
        - label: Any public modified edition will be distinctly titled and will preserve applicable attribution, license, and history notices.
          required: true
        - label: I understand that opening this issue does not reserve the scope exclusively.
          required: true
