name: TeX transcription correction
description: Report or submit a correction to a TeX transcription.
title: "[tex-fix]: "
labels: ["transcription", "needs-review"]
body:
  - type: input
    id: work
    attributes:
      label: Work
      description: Author/title or artifact ZIP.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: Page, section, theorem, equation, or line.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction
      description: What should the TeX say?
    validations:
      required: true
  - type: textarea
    id: witness
    attributes:
      label: Source witness
      description: Link or scan/page evidence for the correction.
    validations:
      required: true
